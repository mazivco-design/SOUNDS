# מייצר קולות ואפקטים ב-ElevenLabs לכל האפליקציות, לפי projects/<app>/list.json, ושומר אותם במאגר.
# המפתח שמור כסוד ELEVENLABS_API_KEY. קבצים שכבר קיימים לא נוצרים שוב (לא מבזבז קרדיטים).
name: eleven-audio
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'רק אפליקציה אחת (שם התיקייה ב-projects). ריק = כולן'
        required: false
        default: ''
permissions:
  contents: write
concurrency: eleven-audio
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/eleven.py
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PROJECT: ${{ inputs.project }}
      - name: save files
        run: |
          git config user.name "eleven-bot"
          git config user.email "eleven-bot@users.noreply.github.com"
          git add projects voices.json
          git diff --cached --quiet && exit 0
          git commit -m "ElevenLabs audio: generated files"
          git pull --rebase
          git push
